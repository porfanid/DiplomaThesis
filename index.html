<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>My Diploma Thesis</title>

  <style>
    :root {
      color-scheme: dark;
      --page: #10131a;
      --panel: #191e28;
      --text: #edf1f7;
      --muted: #aab4c3;
      --accent: #90b4ff;
      --border: #30394a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--page);
      color: var(--text);
      font: 16px/1.5 system-ui, sans-serif;
    }

    main {
      width: min(1100px, 100%);
      margin: 0 auto;
      padding: 32px 20px;
    }

    h1 { margin: 0 0 8px; }
    .intro { color: var(--muted); margin: 0 0 22px; }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }

    .tab {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      background: var(--panel);
      color: var(--text);
      font: inherit;
      cursor: pointer;
    }

    .tab[aria-selected="true"] {
      border-color: var(--accent);
      color: var(--accent);
    }

    .viewer {
      height: min(78vh, 900px);
      min-height: 500px;
      margin-top: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: white;
    }

    .viewer iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .note { color: var(--muted); font-size: .9rem; }

    @media (max-width: 600px) {
      main { padding: 22px 14px; }
      .viewer { min-height: 65vh; }
    }
  </style>
</head>

<body>
  <main>
    <h1>My Diploma Thesis</h1>
    <p class="intro">Browse the thesis documents using the tabs below.</p>

    <div class="tabs" role="tablist" aria-label="Thesis documents">
      <button class="tab" id="tab-notebook" role="tab"
        aria-controls="panel-notebook" aria-selected="true">
        Jupyter Notebook 1
      </button>
      <button class="tab" id="tab-notebook2" role="tab"
        aria-controls="panel-notebook2" aria-selected="false" tabindex="-1">
        Jupyter Notebook 2
      </button>
      <button class="tab" id="tab-pdf" role="tab"
        aria-controls="panel-pdf" aria-selected="false" tabindex="-1">
        Thesis PDF
      </button>
    </div>

    <section class="viewer" id="panel-notebook" role="tabpanel"
      aria-labelledby="tab-notebook">
      <iframe
        src="https://mfr.osf.io/render?url=https://mfr.de-1.osf.io/render?url=https%3A%2F%2Fosf.io%2Fdownload%2Fmbdg3%2F%3Fdirect%26mode%3Drender"
        title="First Jupyter notebook"
        loading="lazy">
      </iframe>
    </section>

    <section class="viewer" id="panel-notebook2" role="tabpanel"
      aria-labelledby="tab-notebook2" hidden>
      <iframe
        src="https://mfr.osf.io/render?url=https://mfr.de-1.osf.io/render?url=https%3A%2F%2Fosf.io%2Fdownload%2Fqjspu%2F%3Fdirect%26mode%3Drender"
        title="Second Jupyter notebook"
        loading="lazy">
      </iframe>
    </section>

    <section class="viewer" id="panel-pdf" role="tabpanel"
      aria-labelledby="tab-pdf" hidden>
      <iframe
        src="https://mfr.osf.io/render?url=https://mfr.de-1.osf.io/render?url=https%3A%2F%2Fosf.io%2Fdownload%2F9y273%2F%3Fdirect%26mode%3Drender"
        title="Thesis PDF"
        loading="lazy">
      </iframe>
    </section>

    <p class="note">If a document does not load, open it directly on OSF or try another browser.</p>
  </main>

  <script>
    const tabs = [...document.querySelectorAll('[role="tab"]')];

    function selectTab(tab) {
      tabs.forEach((item) => {
        const selected = item === tab;
        item.setAttribute('aria-selected', selected);
        item.tabIndex = selected ? 0 : -1;
        document.getElementById(item.getAttribute('aria-controls')).hidden =
          !selected;
      });
      tab.focus();
    }

    tabs.forEach((tab, index) => {
      tab.addEventListener('click', () => selectTab(tab));
      tab.addEventListener('keydown', (event) => {
        if (event.key === 'ArrowRight' || event.key === 'ArrowLeft') {
          event.preventDefault();
          const direction = event.key === 'ArrowRight' ? 1 : -1;
          selectTab(tabs[(index + direction + tabs.length) % tabs.length]);
        }
      });
    });
  </script>
</body>
</html>
