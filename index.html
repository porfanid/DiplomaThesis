<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Diploma Thesis</title>

  <style>
    :root {
      color-scheme: dark;
      --background: #10131a;
      --panel: #191e28;
      --text: #edf1f7;
      --muted: #aab4c3;
      --accent: #90b4ff;
      --border: #30394a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 28px 20px;
      background: var(--background);
      color: var(--text);
      font: 16px/1.5 system-ui, sans-serif;
    }

    main {
      width: min(1100px, 100%);
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 6px;
    }

    .intro {
      margin: 0 0 20px;
      color: var(--muted);
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .tabs button {
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--panel);
      color: var(--text);
      font: inherit;
      cursor: pointer;
    }

    .tabs button[aria-selected="true"] {
      border-color: var(--accent);
      color: var(--accent);
    }

    .tabs button:focus-visible {
      outline: 0px;
      outline-offset: 0px;
    }

    .viewer {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: white;
    }

    .viewer[hidden] {
      display: none;
    }

    .viewer iframe {
      display: block;
      width: 100%;
      height: 677px;
      border: 0;
    }

    @media (max-width: 600px) {
      body {
        padding: 20px 12px;
      }

      .viewer iframe {
        height: 75vh;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>My Diploma Thesis</h1>
    <p class="intro">Use the tabs to view the thesis documents.</p>

    <div class="tabs" role="tablist" aria-label="Thesis documents">
      <button
        id="mind-wandering"
        type="button"
        role="tab"
        aria-selected="true"
        aria-controls="panel-mind-wandering">
        Mind Wandering
      </button>

      <button
        id="novelty-seeking"
        type="button"
        role="tab"
        aria-selected="false"
        aria-controls="panel-novelty-seeking"
        tabindex="-1">
        Novelty Seeking
      </button>

      <button
        id="thesis-pdf"
        type="button"
        role="tab"
        aria-selected="false"
        aria-controls="panel-thesis-pdf"
        tabindex="-1">
        Thesis PDF
      </button>
    </div>

    <section
      class="viewer"
      id="panel-mind-wandering"
      role="tabpanel"
      aria-labelledby="mind-wandering">
      <iframe
        src="https://mfr.de-1.osf.io/render?url=https%3A%2F%2Fosf.io%2Fdownload%2Fmbdg3%2F%3Fdirect%26mode%3Drender"
        scrolling="yes"
        height="677px"
        marginheight="0"
        allowfullscreen
        webkitallowfullscreen
        title="Mind Wandering">
      </iframe>
    </section>

    <section
      class="viewer"
      id="panel-novelty-seeking"
      role="tabpanel"
      aria-labelledby="novelty-seeking"
      hidden>
      <iframe
        src="https://mfr.de-1.osf.io/render?url=https%3A%2F%2Fosf.io%2Fdownload%2Fqjspu%2F%3Fdirect%26mode%3Drender"
        scrolling="yes"
        height="677px"
        marginheight="0"
        allowfullscreen
        webkitallowfullscreen
        title="Novelty Seeking">
      </iframe>
    </section>

    <section
      class="viewer"
      id="panel-thesis-pdf"
      role="tabpanel"
      aria-labelledby="thesis-pdf"
      hidden>
      <iframe
        src="https://mfr.de-1.osf.io/render?url=https%3A%2F%2Fosf.io%2Fdownload%2F6af0391b825e780dafe2c28d%2F%3Fdirect%26mode%3Drender"
        scrolling="yes"
        height="677px"
        marginheight="0"
        allowfullscreen
        webkitallowfullscreen
        title="Thesis PDF">
      </iframe>
    </section>
  </main>

  <script>
    const tabs = [...document.querySelectorAll('[role="tab"]')];

    function selectTab(tab, updateUrl = true) {
      tabs.forEach((item) => {
        const selected = item === tab;
        item.setAttribute("aria-selected", String(selected));
        item.tabIndex = selected ? 0 : -1;

        const panel = document.getElementById(
          item.getAttribute("aria-controls")
        );
        panel.hidden = !selected;
      });

      if (updateUrl) {
        history.replaceState(null, "", "#" + tab.id);
      }
    }

    function selectTabFromHash() {
      const tabId = location.hash.slice(1);
      const matchingTab = tabs.find((tab) => tab.id === tabId);
      selectTab(matchingTab || tabs[0], false);
    }

    tabs.forEach((tab, index) => {
      tab.addEventListener("click", () => selectTab(tab));

      tab.addEventListener("keydown", (event) => {
        if (event.key === "ArrowRight" || event.key === "ArrowLeft") {
          event.preventDefault();
          const step = event.key === "ArrowRight" ? 1 : -1;
          const nextTab = tabs[(index + step + tabs.length) % tabs.length];
          selectTab(nextTab);
          nextTab.focus();
        }
      });
    });

    window.addEventListener("hashchange", selectTabFromHash);
    selectTabFromHash();
  </script>
</body>
</html>
